# Local personal workspace. Never remove 127.0.0.1 from the published port.
# Independent from the contributor database in compose.yaml.
name: relay-local
services:
  app:
    image: ${RELAY_IMAGE:-repro-relay-local:source}
    build: .
    environment:
      REPRO_MODE: local
      REPRO_LOCAL_CONTAINER: "1"
      PORT: "8178"
      DATABASE_URL: postgres://relay:relay_local_only@db:5432/relay
    ports:
      - "127.0.0.1:8178:8178"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - settings:/app/.data
    restart: unless-stopped
    init: true
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    healthcheck:
      test: [CMD, curl, --fail, --silent, --max-time, "4", http://127.0.0.1:8178/api/v1/health]
      interval: 3s
      timeout: 5s
      retries: 30
      start_period: 20s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: relay
      POSTGRES_PASSWORD: relay_local_only
      POSTGRES_DB: relay
    # No published database port. This credential only belongs to this stack.
    volumes:
      - database:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: [CMD-SHELL, pg_isready -U relay -d relay]
      interval: 2s
      timeout: 3s
      retries: 30
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
volumes:
  database:
  settings:
