services:
  agent:
    build:
      context: ..
      dockerfile: cloud/Dockerfile
    image: repro-relay-agent:local
    platform: linux/amd64
    environment:
      AGENT_ID: repro-relay
      # Which computer the owner installed from, one of macos, windows or linux. The
      # installer sets it; started any other way, or by an agent from before this existed,
      # it reads as unknown, which means not known rather than any particular computer.
      RELAY_OWNER_PLATFORM: ${RELAY_OWNER_PLATFORM:-unknown}
    volumes:
      - type: bind
        source: ./plow-credentials
        target: /var/lib/plow/credentials.host
        read_only: true
        bind:
          create_host_path: false
      - agent-home:/var/lib/hermes
    restart: unless-stopped
    stop_grace_period: 35s
volumes:
  agent-home:
