# Multi-agent, multi-line deployment template for ARM64 or AMD64 hosts.
# Each service gets a unique AGENT_ID, its own Plow credential file, and an
# isolated Hermes home volume. No credential value is stored in this file.
#
# Prepare credential files first:
#   for n in 01 02 03 04 05 06 07 08 09 10; do
#     plow-agents mint ln_xxxxxxxxxx$n --credential-file ./plow-credentials-$n
#   done
#
# Deploy:
#   docker compose -p repro-relay-agents -f compose.multi-agent.yml up -d
#
# For ARM64 hosts, build the image first:
#   docker buildx build --platform linux/arm64 -t repro-relay-agent:local -f Dockerfile .

services:
  agent-01:
    image: repro-relay-agent:local
    environment:
      AGENT_ID: repro-relay-01
    volumes:
      - type: bind
        source: ./plow-credentials-01
        target: /var/lib/plow/credentials.host
        read_only: true
      - agent-home-01:/var/lib/hermes
    restart: unless-stopped
    stop_grace_period: 35s

