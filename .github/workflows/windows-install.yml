name: Windows install
# Separate from Windows compatibility so its result is readable without waiting
# for the desktop and browser job, which takes three times as long.
on: [push, workflow_dispatch]
permissions:
  contents: read
jobs:
  installer:
    # The job above covers the app and the web. Nothing covered the install path,
    # which is how the privacy the installer promises could be silently false on
    # Windows: chmod 0600 there leaves a credential at mode 0666.
    runs-on: windows-latest
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # certifi as well as pyyaml: a Windows Python has no issuer for GitHub's certificate
      # until a bundle is pointed at it, and the contract tests download the pinned client.
      - run: python -m pip install --quiet pyyaml certifi
      - name: The command runs the way a Windows terminal types it
        run: python relay agent --help > /dev/null
      - name: The installer suite passes on Windows
        run: python -m unittest discover -s integrations/relay-terminal -p "test_*.py"
      - name: The agent suite passes on Windows
        run: python -m unittest discover -s agent/tests -p "test_*.py"
      - name: The Plow bridge suite passes on Windows
        run: python -m unittest discover -s integrations/plow -p "test_*.py"
      - name: A file the installer calls private is private on this real Windows host
        run: |
          python - <<'PY'
          import pathlib, sys, tempfile
          sys.path.insert(0, 'integrations/relay-terminal')
          import private_files
          f = pathlib.Path(tempfile.mkdtemp()) / 'credential'
          f.write_text('placeholder')
          private_files.protect(f)
          if not private_files.is_private(f):
              raise SystemExit('protect() returned but the file is not private on this host')
          print('protect and is_private agree on real Windows')
          PY
