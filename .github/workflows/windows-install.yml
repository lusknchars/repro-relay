name: Windows install
# Separate from Windows compatibility so its result is readable without waiting
# for the desktop and browser job, which takes three times as long.
on: [push, workflow_dispatch]
permissions:
  contents: read
jobs:
  installer:
    # The job above covers the app and the web. Nothing covered the install path,
    # which is how the privacy the installer promises could be silently false on
    # Windows: chmod 0600 there leaves a credential at mode 0666.
    runs-on: windows-latest
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # certifi as well as pyyaml: a Windows Python has no issuer for GitHub's certificate
      # until a bundle is pointed at it, and the contract tests download the pinned client.
      - run: python -m pip install --quiet pyyaml certifi
      - name: The command runs the way a Windows terminal types it
        run: python relay agent --help > /dev/null
      - name: The installer suite passes on Windows
        run: python -m unittest discover -s integrations/relay-terminal -p "test_*.py"
      - name: The agent suite passes on Windows
        run: python -m unittest discover -s agent/tests -p "test_*.py"
      - name: The Plow bridge suite passes on Windows
        run: python -m unittest discover -s integrations/plow -p "test_*.py"
      - name: What the installer calls private is private on this real Windows host
        run: |
          python - <<'PY'
          import pathlib, sys, tempfile
          sys.path.insert(0, 'integrations/relay-terminal')
          import private_files
          root = pathlib.Path(tempfile.mkdtemp())
          credential = root / 'credential'
          credential.write_text('placeholder')
          private_files.protect(credential)
          if not private_files.is_private(credential):
              raise SystemExit('protect() returned but the file is not private on this host')
          # A folder as well as a file, and then a file written inside it: the installer
          # protects .data/setup and .data/agent and only afterwards writes the lock, the
          # log and the install record into them. A grant without the inheritance flags
          # leaves those with no access list at all, which nobody can open, owner included.
          folder = root / 'state'
          folder.mkdir()
          private_files.protect(folder)
          if not private_files.is_private(folder):
              raise SystemExit('protect() returned but the folder is not private on this host')
          inside = folder / 'service.log'
          inside.write_text('placeholder')
          if inside.read_text() != 'placeholder':
              raise SystemExit('a file written inside a protected folder could not be read back')
          if not private_files.is_private(inside):
              raise SystemExit('a file inside a protected folder is not private on this host')
          print('protect and is_private agree on real Windows: a file, a folder, and what is written inside it')
          PY
