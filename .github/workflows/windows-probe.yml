name: Windows probe
# Temporary: measures what the installer actually does on Windows, so the fixes
# are written against real behaviour rather than assumptions. Removed once the
# Windows install job in windows-compatibility.yml covers this ground.
on: [push, workflow_dispatch]
permissions:
  contents: read
defaults:
  run:
    shell: bash
jobs:
  probe:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Python and platform identity
        run: python -c "import sys, os; print('platform', sys.platform); print('os.name', os.name)"
      - name: Does the entry point run
        continue-on-error: true
        run: python relay --help > /dev/null && echo "relay --help OK"
      - name: Does the agent subcommand run
        continue-on-error: true
        run: python relay agent --help
      - name: The installer test suite on Windows
        continue-on-error: true
        run: |
          python -m unittest discover -s integrations/relay-terminal -p "test_*.py" > out.txt 2>&1 || true
          grep -E '^(ERROR|FAIL):' out.txt | sed -E 's/ \(.*//' | sort | uniq -c | sort -rn
          echo '--- distinct exception lines ---'
          grep -E '^[A-Za-z_.]*(Error|Exception):' out.txt | sort | uniq -c | sort -rn | head -20
          tail -3 out.txt
      - name: The agent test suite on Windows
        continue-on-error: true
        run: |
          python -m unittest discover -s agent/tests -p "test_*.py" > agent.txt 2>&1 || true
          grep -E '^(ERROR|FAIL):' agent.txt | sed -E 's/ \(.*//' | sort | uniq -c | sort -rn
          echo '--- distinct exception lines ---'
          grep -E '^[A-Za-z_.]*(Error|Exception):' agent.txt | sort | uniq -c | sort -rn | head -20
          tail -3 agent.txt
      - name: What chmod 0600 actually does here
        continue-on-error: true
        run: |
          python - <<'PY'
          import os, pathlib, stat, subprocess, tempfile
          f = pathlib.Path(tempfile.mkdtemp()) / 'credential.json'
          f.write_text('{"token": "placeholder"}')
          os.chmod(f, 0o600)
          print('mode after chmod 0600:', oct(stat.S_IMODE(f.stat().st_mode)))
          print('--- who can actually read it ---')
          print(subprocess.run(['icacls', str(f)], capture_output=True, text=True).stdout)
          PY
      - name: Can icacls lock a file to the current user
        continue-on-error: true
        run: |
          python - <<'PY'
          import getpass, os, pathlib, subprocess, tempfile
          f = pathlib.Path(tempfile.mkdtemp()) / 'credential.json'
          f.write_text('{"token": "placeholder"}')
          user = os.environ.get('USERNAME') or getpass.getuser()
          r = subprocess.run(['icacls', str(f), '/inheritance:r', '/grant:r', user + ':F'],
                             capture_output=True, text=True)
          print('icacls exit', r.returncode, r.stdout.strip(), r.stderr.strip())
          print('--- resulting access ---')
          print(subprocess.run(['icacls', str(f)], capture_output=True, text=True).stdout)
          PY
      - name: Does the execution ledger refuse on Windows
        continue-on-error: true
        run: |
          python - <<'PY'
          import os
          print('has O_NOFOLLOW:', hasattr(os, 'O_NOFOLLOW'))
          print('open supports dir_fd:', os.open in os.supports_dir_fd)
          PY
      - name: Encoding and console defaults
        continue-on-error: true
        run: |
          python - <<'PY'
          import locale, sys
          print('stdout encoding:', sys.stdout.encoding)
          print('preferred encoding:', locale.getpreferredencoding(False))
          print('filesystem encoding:', sys.getfilesystemencoding())
          PY
      - name: Is docker usable here
        continue-on-error: true
        run: |
          docker version || echo "docker version failed"
          docker compose version || echo "docker compose failed"
