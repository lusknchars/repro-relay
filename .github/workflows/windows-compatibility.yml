name: Windows compatibility
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  edge-and-desktop:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - run: npm ci --prefix web
      - run: npm ci --prefix web/reptest
      - run: npm run build --prefix web
      - name: Install Microsoft Edge for the isolated runner
        working-directory: web
        run: npx playwright install msedge
      - name: Exercise the investigation UI in Edge on Windows
        run: npm run test:edge --prefix web
      - name: Start isolated PostgreSQL for backend browser tests
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if (-not (Test-Path "$env:PGBIN/pg_ctl.exe")) { throw 'PostgreSQL tools are missing from the runner.' }
          $env:PGBIN | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          $testData = Join-Path $env:RUNNER_TEMP 'relay-postgres'
          & "$env:PGBIN/initdb.exe" -D $testData -U relay -A trust --no-locale
          if ($LASTEXITCODE -ne 0) { throw 'PostgreSQL initialization failed.' }
          & "$env:PGBIN/pg_ctl.exe" -D $testData -l "$env:RUNNER_TEMP/relay-postgres.log" -o '-h 127.0.0.1 -p 55478' -w start
          if ($LASTEXITCODE -ne 0) { throw 'PostgreSQL startup failed.' }
          & "$env:PGBIN/createdb.exe" -h 127.0.0.1 -p 55478 -U relay relay
          if ($LASTEXITCODE -ne 0) { throw 'Relay database creation failed.' }
      - name: Build the Rust API used by frontend tests
        run: cargo build -p relay-api
      - name: Exercise the supplied default frontend in Edge on Windows
        run: npm run test:reptest --prefix web
        env:
          REPRO_BROWSER_CHANNEL: msedge
      - name: Check native Windows desktop compilation
        run: cargo check -p relay-desktop
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-edge-compatibility-results
          path: |
            web/test-results/compatibility-artifacts
            web/test-results/exact-reptest
          if-no-files-found: ignore

  installer:
    # The job above covers the app and the web. Nothing covered the install path,
    # which is how the privacy the installer promises could be silently false on
    # Windows: chmod 0600 there leaves a credential at mode 0666.
    runs-on: windows-latest
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # certifi as well as pyyaml: a Windows Python has no issuer for GitHub's certificate
      # until a bundle is pointed at it, and the contract tests download the pinned client.
      - run: python -m pip install --quiet pyyaml certifi
      - name: The command runs the way a Windows terminal types it
        run: python relay agent --help > /dev/null
      - name: The installer suite passes on Windows
        run: python -m unittest discover -s integrations/relay-terminal -p "test_*.py"
      - name: The agent suite passes on Windows
        run: python -m unittest discover -s agent/tests -p "test_*.py"
      - name: The Plow bridge suite passes on Windows
        run: python -m unittest discover -s integrations/plow -p "test_*.py"
      - name: A file the installer calls private is private on this real Windows host
        run: |
          python - <<'PY'
          import pathlib, sys, tempfile
          sys.path.insert(0, 'integrations/relay-terminal')
          import private_files
          f = pathlib.Path(tempfile.mkdtemp()) / 'credential'
          f.write_text('placeholder')
          private_files.protect(f)
          if not private_files.is_private(f):
              raise SystemExit('protect() returned but the file is not private on this host')
          print('protect and is_private agree on real Windows')
          PY
