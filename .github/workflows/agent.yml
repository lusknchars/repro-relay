name: Plow agent
on:
  push:
    paths: ['agent/**', '.github/workflows/agent.yml']
  pull_request:
    paths: ['agent/**', '.github/workflows/agent.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 -m unittest discover -s agent/tests -v
      - run: docker compose -f agent/compose.yml build
      - name: Check official reporter without credentials or network
        run: >-
          docker run --rm --platform linux/amd64 --network none
          --entrypoint /opt/hermes/.venv/bin/python3 repro-relay-agent:local
          /opt/plow/agent-index-client.py --self-check
      - name: Check the transport watchdog is in the image
        run: >-
          docker run --rm --platform linux/amd64 --network none
          --entrypoint /bin/sh repro-relay-agent:local -c
          'test -x /etc/s6-overlay/s6-rc.d/transport-watchdog/run &&
          test -f /etc/s6-overlay/s6-rc.d/user/contents.d/transport-watchdog &&
          /opt/hermes/.venv/bin/python3 -I -S -c "import runpy, sys; runpy.run_path(sys.argv[1])"
          /etc/s6-overlay/scripts/transport_watchdog.py'
