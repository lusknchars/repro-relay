name: macOS desktop
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  desktop:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            web/package-lock.json
            web/reptest/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - run: npm ci --prefix web
      - run: npm ci --prefix web/reptest
      - name: Build the macOS application
        run: npm run tauri --prefix web -- build --debug
      - name: Preserve the app bundle permissions
        run: ditto -c -k --keepParent 'target/debug/bundle/macos/Repro Relay.app' "$RUNNER_TEMP/ReproRelay-macOS.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: repro-relay-macos-debug
          path: ${{ runner.temp }}/ReproRelay-macOS.zip
          if-no-files-found: error
