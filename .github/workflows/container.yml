name: Packaged local app
on:
  push:
    branches: [main]
    paths:
      - 'Dockerfile'
      - 'Cargo.*'
      - 'crates/**'
      - 'web/**'
      - 'integrations/**'
      - 'relay'
      - 'compose.local.yaml'
      - 'start.sh'
      - 'install.sh'
      - 'scripts/test_easy_start.py'
      - 'scripts/test-local-container.py'
      - '.github/workflows/container.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: packaged-local-${{ github.ref }}
  cancel-in-progress: false
jobs:
  image:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            arch: amd64
          - runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Installer failure and retry behavior
        run: python3 -m unittest discover -s scripts -p 'test_easy_start.py' -v
      - uses: docker/setup-buildx-action@v3
      - name: Build the shipped image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: relay-package:test
          cache-from: type=gha,scope=relay-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=relay-${{ matrix.arch }}
      - name: Fresh install, access checks and restart persistence
        run: python3 scripts/test-local-container.py
      - name: Log in to the package registry
        if: github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish the tested architecture
        if: github.ref == 'refs/heads/main'
        env:
          IMAGE: ghcr.io/${{ github.repository }}
          ARCH: ${{ matrix.arch }}
        run: |
          docker tag relay-package:test "$IMAGE:sha-$GITHUB_SHA-$ARCH"
          docker push "$IMAGE:sha-$GITHUB_SHA-$ARCH"
  manifest:
    needs: image
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      packages: write
    steps:
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish only after both architectures pass
        env:
          IMAGE: ghcr.io/${{ github.repository }}
        run: |
          docker buildx imagetools create --tag "$IMAGE:main" --tag "$IMAGE:sha-$GITHUB_SHA" \
            "$IMAGE:sha-$GITHUB_SHA-amd64" "$IMAGE:sha-$GITHUB_SHA-arm64"
