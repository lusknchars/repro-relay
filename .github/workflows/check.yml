name: Check
on: [push, pull_request]
jobs:
  workflow:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: relay
          POSTGRES_PASSWORD: relay_local_only
          POSTGRES_DB: relay
        ports: ['55478:5432']
        options: >-
          --health-cmd "pg_isready -U relay -d relay"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: npm ci --prefix web
      - run: npm ci --prefix web/reptest
      - run: npm exec --prefix web -- playwright install --with-deps chromium
      - run: make check
