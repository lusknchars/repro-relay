<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Repro Relay — Try the demo</title>
  <style>
    :root { color-scheme: light dark; }
    * { box-sizing: border-box; }
    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      max-width: 720px;
      margin: 0 auto;
      padding: 2rem 1rem;
      line-height: 1.6;
      background: #fafafa;
      color: #111;
    }
    @media (prefers-color-scheme: dark) {
      body { background: #0a0a0a; color: #eee; }
      textarea, button { background: #1a1a1a; color: #eee; border-color: #444; }
      .task { background: #151515; border-color: #333; }
    }
    h1 { font-size: 1.75rem; margin-bottom: 0.25rem; }
    p.lead { color: #666; margin-top: 0; }
    label { display: block; font-weight: 600; margin: 1.5rem 0 0.5rem; }
    textarea {
      width: 100%;
      min-height: 140px;
      padding: 0.75rem;
      border: 1px solid #ccc;
      border-radius: 0.5rem;
      font: inherit;
      resize: vertical;
    }
    .actions { display: flex; gap: 0.75rem; margin-top: 1rem; }
    button {
      padding: 0.65rem 1.25rem;
      border: 1px solid #ccc;
      border-radius: 0.5rem;
      font: inherit;
      cursor: pointer;
    }
    button.primary { background: #111; color: #fff; border-color: #111; }
    button.primary:hover { background: #333; }
    #output { margin-top: 1.5rem; }
    .task {
      border: 1px solid #ddd;
      border-radius: 0.5rem;
      padding: 1rem;
      margin-bottom: 0.75rem;
      background: #fff;
    }
    .task strong { display: block; font-size: 1.05rem; }
    .meta { color: #666; font-size: 0.9rem; margin-top: 0.25rem; }
    .empty { color: #888; font-style: italic; }
    .error { color: #c00; }
    footer { margin-top: 3rem; font-size: 0.85rem; color: #888; }
  </style>
</head>
<body>
  <h1>Try Repro Relay</h1>
  <p class="lead">Paste meeting notes and get owned action items with deadlines. No install, no Plow line, no phone number.</p>

  <label for="notes">Meeting notes</label>
  <textarea id="notes" placeholder="Ana will review the export bug by September 18, 2026. Bruno will document setup by September 19, 2026."></textarea>

  <div class="actions">
    <button class="primary" id="extract" onclick="extract()">Extract tasks</button>
    <button onclick="loadExample()">Load example</button>
  </div>

  <div id="output"></div>

  <footer>
    This is a rule-based demo. The full agent stores tasks across restarts, links them to source evidence, and hands them off to coding agents.
  </footer>

  <script>
    const apiBase = window.location.origin.includes('5178') ? '' : '/api/v1';

    function loadExample() {
      document.getElementById('notes').value =
        "Ana will review the export bug by September 18, 2026.\n" +
        "Bruno will document setup by September 19, 2026.\n" +
        "Carlos to update the API schema by 2026-09-20.";
    }

    async function extract() {
      const notes = document.getElementById('notes').value;
      const output = document.getElementById('output');
      output.innerHTML = '<p class="empty">Extracting…</p>';
      try {
        const res = await fetch(`${apiBase}/demo/meeting-notes`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ notes }),
        });
        const data = await res.json();
        if (!res.ok) {
          output.innerHTML = `<p class="error">${data.error?.message || 'Something went wrong.'}</p>`;
          return;
        }
        if (!data.tasks || data.tasks.length === 0) {
          output.innerHTML = '<p class="empty">No tasks found. Try sentences like "Ana will review the bug by September 18, 2026."</p>';
          return;
        }
        output.innerHTML = data.tasks.map(t => `
          <div class="task">
            <strong>${escapeHtml(t.owner)}: ${escapeHtml(t.task)}</strong>
            <div class="meta">Deadline: ${t.deadline ? escapeHtml(t.deadline) : 'not detected'}</div>
            <div class="meta">Source: “${escapeHtml(t.source_quote)}”</div>
          </div>
        `).join('');
      } catch (err) {
        output.innerHTML = `<p class="error">${err.message}</p>`;
      }
    }

    function escapeHtml(text) {
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }
  </script>
</body>
</html>
